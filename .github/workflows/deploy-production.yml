name: Deploy to Production

# Auto-deploy every push to main straight to Vercel production
# (replaces the need to manually "Promote to Production" in the dashboard).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once; newest push wins.
concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DtG7MDZc4CZpjHLsPauTsGBA
      VERCEL_PROJECT_ID: prj_qETiPQcZLYd2A4FNhqmprx21nRUe
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Blocking gate. A page that claims licensing, insurance, a lifetime
      # warranty, a made-up rating or a guaranteed arrival window must not reach
      # production, whoever or whatever wrote it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim guard
        run: python tools/claim_guard.py

      # Self-healing, not a gate. An article with no hero image is a quality
      # problem, not a legal one, so it must not hold production hostage the way
      # the claim guard does. It also must not ship: two guides went live
      # imageless in September 2026 and nobody noticed for a week.
      #
      # The push below uses GITHUB_TOKEN, which by design cannot trigger another
      # workflow, so committing to main from inside this job does not re-trigger
      # this deploy. The repaired files are already in the working tree, so the
      # deploy in the next step ships them either way.
      - name: Heal missing blog hero images
        run: |
          python tools/hero_guard.py --fix
          if git diff --quiet; then
            echo "Nothing to heal."
            exit 0
          fi
          git config user.name "SEO Bot"
          git config user.email "bot@noahgaragesd.com"
          git add blog/
          git commit -m "fix(blog): add hero images the publisher left out"
          git push

      - name: Install Vercel CLI
        run: npm install -g vercel@50

      - name: Deploy to Vercel production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
