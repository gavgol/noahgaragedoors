name: Claim Guard

# Blocks copy the business cannot substantiate: licensing/insurance/bonding,
# background checks, lifetime warranties, invented star ratings or review
# counts, guaranteed arrival windows, and em-dashes.
#
# This runs on the FILES, not on one generator's output, because the previous
# guard lived inside publish-seo-article.yml and stopped covering anything the
# moment article publishing moved to a different routine.
#
# NOTE: no `push` trigger on purpose. deploy-production.yml already runs
# claim_guard.py as a blocking gate on every push to main, so running it again
# here on push was pure duplication, and those duplicate runs kept failing to
# acquire a hosted runner ("job was not acquired by Runner") and emailing false
# alarms. Production stays gated by the deploy. This workflow now covers PRs
# (pre-merge), a weekly structural audit, and manual runs.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch: {}

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every page for unsubstantiated claims
        run: python tools/claim_guard.py

      # Quality, not safety. Runs here rather than in deploy-production.yml on
      # purpose: the claim guard blocks a deploy because shipping an
      # unsubstantiated claim is a legal problem, whereas a dead link or a
      # sitemap gap should be loud without holding production hostage.
      - name: Structural SEO audit
        run: python tools/seo_audit.py
